<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>事项台账</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --ink:#1b2430;
  --ink-soft:#3a4453;
  --paper:#f6f4ee;
  --paper-dim:#ece8dd;
  --card:#fffdf8;
  --line:#ddd5c3;
  --line-soft:#e8e2d3;
  --jade:#2f6f5e;
  --jade-soft:#e2eee9;
  --clay:#a85a2a;
  --clay-soft:#f3e6d8;
  --indigo:#3d4f8f;
  --indigo-soft:#e5e8f3;
  --amber:#bd7f1c;
  --amber-soft:#f6ead0;
  --muted:#767065;
  --danger:#a13d3d;
  --radius:10px;
  --shadow:0 1px 2px rgba(27,36,48,.06), 0 4px 14px rgba(27,36,48,.05);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;}
#app{max-width:1080px;margin:0 auto;padding:0 20px 100px;min-height:100vh;}
h1,h2,h3{font-family:'Source Serif 4',serif;font-weight:600;margin:0;}
.mono{font-family:'IBM Plex Mono',monospace;}
.muted{color:var(--muted);}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:13.5px;}

header.top{display:flex;align-items:center;justify-content:space-between;padding:22px 0 14px;position:sticky;top:0;background:var(--paper);z-index:20;border-bottom:1px solid var(--line);}
.brand{display:flex;align-items:baseline;gap:10px;}
.brand h1{font-size:21px;letter-spacing:.2px;}
.brand .sub{font-size:11.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;letter-spacing:.3px;}
nav.tabs{display:flex;gap:4px;background:var(--paper-dim);padding:4px;border-radius:999px;}
nav.tabs button{border:none;background:transparent;padding:7px 15px;border-radius:999px;font-size:13px;color:var(--ink-soft);font-weight:500;transition:.15s;}
nav.tabs button.active{background:var(--ink);color:var(--paper);}

.filterbar{display:flex;align-items:center;gap:10px;margin:16px 0 6px;flex-wrap:wrap;}
.filterbar select{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:6px 10px;color:var(--ink-soft);}
.daypill{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);}

.daylabel{display:flex;align-items:baseline;gap:8px;margin:22px 0 8px;}
.daylabel .d{font-family:'Source Serif 4',serif;font-size:15px;font-weight:600;}
.daylabel .n{font-size:11px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
.daylabel hr{flex:1;border:none;border-top:1px dashed var(--line);}

.row{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--radius);padding:9px 13px;margin-bottom:6px;box-shadow:var(--shadow);}
.row .top{display:flex;align-items:flex-start;gap:10px;}
.rowgrid{display:grid;grid-template-columns:80px 124px 1fr 32px 32px 20px;align-items:center;gap:12px;}
.rowgrid.simple{grid-template-columns:70px 1fr 32px 20px;}
.tablehead{display:grid;grid-template-columns:80px 124px 1fr 32px 32px 20px;gap:12px;padding:2px 13px 7px;}
.tablehead.simple{grid-template-columns:70px 1fr 32px 20px;}
.tablehead span{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.3px;text-transform:uppercase;}
.rowgrid .col-time{font-size:12px;font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);line-height:1.35;}
.rowgrid .col-time .ov{display:block;color:var(--amber);font-size:10px;margin-top:1px;font-family:inherit;}
.rowgrid .col-who{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rowgrid .col-content{min-width:0;}
.rowgrid .col-content .subtitle{font-size:11px;color:var(--muted);margin-top:2px;cursor:pointer;}
.rowgrid .col-content .subtitle:hover{color:var(--ink);text-decoration:underline;}
.takeawaybtn{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:13px;flex:0 0 auto;cursor:pointer;transition:.12s;}
.takeawaybtn:hover{border-color:var(--jade);color:var(--jade);}
.takeawaybtn.has{color:var(--jade);border-color:var(--jade-soft);background:var(--jade-soft);}
.chk{width:19px;height:19px;border-radius:6px;border:1.6px solid var(--ink-soft);flex:0 0 auto;margin-top:1px;display:flex;align-items:center;justify-content:center;background:transparent;color:transparent;transition:.12s;}
.chk.done{background:var(--jade);border-color:var(--jade);color:#fff;}
.row .body{flex:1;min-width:0;}
.row .title{font-size:14.5px;font-weight:500;line-height:1.35;cursor:text;}
.row.done .title{text-decoration:line-through;color:var(--muted);}
.meta{display:flex;flex-wrap:nowrap;gap:6px;margin-top:5px;align-items:center;overflow-x:auto;scrollbar-width:none;}
.meta::-webkit-scrollbar{display:none;}
.meta .tag{flex:0 0 auto;}
.tag{font-size:10.5px;padding:2px 7px;border-radius:5px;font-weight:500;letter-spacing:.2px;}
.tag.cat-recurring{background:var(--jade-soft);color:var(--jade);}
.tag.cat-adhoc{background:var(--clay-soft);color:var(--clay);}
.tag.cat-project{background:var(--indigo-soft);color:var(--indigo);}
.tag.overdue{background:var(--amber-soft);color:var(--amber);}
.tag.time{background:var(--paper-dim);color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
.tag.who{background:transparent;color:var(--muted);border:1px solid var(--line);}
.tag.takeaway-tag{background:var(--jade-soft);color:var(--jade);}
.rowbtns{display:flex;gap:4px;margin-left:auto;flex:0 0 auto;}
.iconbtn{border:none;background:transparent;color:var(--muted);font-size:14px;padding:3px 6px;border-radius:6px;}
.iconbtn:hover{background:var(--paper-dim);color:var(--ink);}

.chain{margin-top:10px;padding-top:10px;border-top:1px solid var(--line-soft);}
.chain-item{display:flex;align-items:flex-start;gap:9px;padding:5px 0;position:relative;}
.chain-item .dot{width:9px;height:9px;border-radius:50%;background:var(--paper-dim);border:1.6px solid var(--line);margin-top:5px;flex:0 0 auto;position:relative;z-index:1;cursor:pointer;}
.chain-item .dot.done{background:var(--jade);border-color:var(--jade);}
.chain-item:not(:last-child)::before{content:'';position:absolute;left:4px;top:16px;width:1.4px;height:calc(100% - 4px);background:var(--line);}
.chain-item .stxt{font-size:13px;line-height:1.4;flex:1;}
.chain-item.sdone .stxt{color:var(--muted);text-decoration:line-through;}
.chain-item .stime{font-size:10.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;white-space:nowrap;}

.takeaway-toggle{margin-top:9px;font-size:11.5px;color:var(--jade);background:var(--jade-soft);display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:6px;border:none;}
.takeaway-list{margin-top:8px;padding:9px 10px;background:var(--paper-dim);border-radius:7px;font-size:12.5px;}
.takeaway-list .ta-item{padding:5px 0;border-bottom:1px solid var(--line-soft);}
.takeaway-list .ta-item:last-child{border:none;}
.ta-tags{margin-top:3px;}
.ta-tags span{font-size:10px;color:var(--muted);background:var(--card);padding:1px 6px;border-radius:4px;margin-right:4px;}

.empty{padding:40px 10px;text-align:center;color:var(--muted);}
.empty b{display:block;font-family:'Source Serif 4',serif;font-size:16px;color:var(--ink-soft);margin-bottom:4px;}


.overlay{position:fixed;inset:0;background:rgba(27,32,40,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:100;overflow:auto;}
.modal{background:var(--paper);border-radius:14px;max-width:560px;width:100%;padding:22px 22px 20px;box-shadow:0 20px 60px rgba(0,0,0,.3);position:relative;}
.modal h2{font-size:18px;margin-bottom:14px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:500;}
.field input[type=text],.field input[type=date],.field input[type=time],.field input[type=password],.field input[type=email],.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);}
.field textarea{resize:vertical;min-height:70px;}
.inline{display:flex;gap:10px;}
.inline .field{flex:1;}
.checkline{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-soft);margin-top:6px;}
.btnrow{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;}
.btn{border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:500;}
.btn.primary{background:var(--ink);color:var(--paper);}
.btn.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
.btn.jade{background:var(--jade);color:#fff;}
.btn:disabled{opacity:.5;cursor:default;}
.btn.sm{padding:5px 10px;font-size:12px;}
.hint{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.6;}
.aiflag{font-size:9.5px;background:var(--amber-soft);color:var(--amber);padding:1px 5px;border-radius:4px;margin-left:6px;font-weight:600;}
.cardsplit{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;background:var(--card);}
.cardsplit h3{font-size:13.5px;margin-bottom:8px;color:var(--ink-soft);}
.toast{position:fixed;bottom:96px;right:26px;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:13px;z-index:200;box-shadow:var(--shadow);max-width:300px;}

.libcard{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);}
.libcard .lh{display:grid;grid-template-columns:18px 1fr 150px 88px auto;align-items:center;gap:10px;cursor:pointer;}
.libcard .lh h3{font-size:14.5px;}
.libcard .lh .car{transition:.15s;color:var(--muted);}
.libcard.open .lh .car{transform:rotate(90deg);}
.libtablehead{display:grid;grid-template-columns:18px 1fr 150px 88px auto;gap:10px;padding:0 16px 6px;}
.libtablehead span{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.3px;text-transform:uppercase;}
.col-who-plain{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.libcard .detail{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--line-soft);}
.libcard.open .detail{display:block;}
.addstepline{display:flex;gap:6px;margin-top:10px;}
.addstepline input{flex:1;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--card);}

.dropdownmgr{margin-bottom:22px;}
.chipwrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.chip{background:var(--paper-dim);border-radius:6px;padding:4px 9px;font-size:12px;display:flex;align-items:center;gap:6px;}
.chip button{border:none;background:transparent;color:var(--muted);font-size:12px;line-height:1;}
.stkpicker{display:flex;flex-direction:column;gap:6px;}
.stkchips{display:flex;flex-wrap:wrap;gap:5px;}
.stkchips:empty{display:none;}
.stkpicker input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--card);font:inherit;}
.chip.sm{padding:3px 7px;font-size:11.5px;}
.addline{display:flex;gap:6px;margin-top:8px;}
.addline input{flex:1;padding:6px 9px;border:1px solid var(--line);border-radius:7px;}

.newmenu{position:relative;}
.popover{position:absolute;top:calc(100% + 6px);right:0;background:var(--card);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);z-index:40;overflow:hidden;min-width:150px;}
.popover button{display:block;width:100%;text-align:left;padding:9px 12px;border:none;background:transparent;font-size:13px;color:var(--ink-soft);}
.popover button:hover{background:var(--paper-dim);}

.micbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);flex:0 0 auto;font-size:15px;color:var(--ink-soft);}
.micbtn.listening{background:var(--danger);color:#fff;border-color:var(--danger);animation:pulse 1.2s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(161,61,61,.5);}70%{box-shadow:0 0 0 9px rgba(161,61,61,0);}100%{box-shadow:0 0 0 0 rgba(161,61,61,0);}}
.captureinputrow{display:flex;gap:8px;align-items:flex-start;}
.captureinputrow textarea{flex:1;}

.statusdot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
.statusdot.on{background:var(--jade);}
.statusdot.off{background:var(--muted);}
.segwrap{display:flex;gap:6px;margin-top:6px;}
.segbtn{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:7px;font-size:12.5px;color:var(--ink-soft);}
.segbtn.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.settingsblock{border:1px solid var(--line-soft);border-radius:10px;padding:14px 16px;margin-bottom:16px;background:var(--card);}
.settingsblock h3{font-size:14px;margin-bottom:8px;}

.row[draggable=true]{cursor:grab;}
.row.dragging{opacity:.4;}
.row.dragover{border-color:var(--ink-soft);box-shadow:0 0 0 2px var(--ink-soft) inset;}
.draghandle{color:var(--muted);font-size:16px;letter-spacing:-2px;padding:2px 4px;cursor:grab;user-select:none;}

.weeknav{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap;}
.weekstrip{display:flex;gap:5px;}
.weekstrip .wcell{width:38px;text-align:center;padding:5px 2px;border-radius:7px;background:var(--card);border:1px solid var(--line-soft);cursor:pointer;}
.weekstrip .wcell.today{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.weekstrip .wcell .wd{font-size:9.5px;color:inherit;opacity:.7;display:block;}
.weekstrip .wcell .wn{font-size:12.5px;font-family:'IBM Plex Mono',monospace;font-weight:600;display:block;}
.weekstrip .wcell .wdot{width:4px;height:4px;border-radius:50%;background:var(--clay);display:inline-block;margin-top:2px;}
.weekstrip .wcell.today .wdot{background:var(--paper);}
.recwidget{margin-top:4px;}

.quickaddbar{display:flex;gap:8px;margin:14px 0 4px;}
.quickaddbar input{flex:1;padding:10px 13px;border:1px solid var(--line);border-radius:9px;background:var(--card);font-size:13.5px;box-shadow:var(--shadow);}
.quickaddbar input:focus{outline:none;border-color:var(--ink-soft);}
.quickaddbar #quickAddAI{flex:0 0 auto;white-space:nowrap;font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:0 14px;}
.quickaddbar #quickAddAI:hover{color:var(--ink);border-color:var(--ink-soft);}

.row{transition:box-shadow .12s, border-color .12s;}
.row:hover{border-color:var(--line);box-shadow:0 2px 6px rgba(27,36,48,.08), 0 1px 2px rgba(27,36,48,.06);}
.libcard{transition:box-shadow .12s;}
.libcard:hover{box-shadow:0 2px 8px rgba(27,36,48,.09);}
.rowmenu-btn{color:var(--muted);}
.rowmenu-btn:hover{background:var(--paper-dim);color:var(--ink);}

@media (max-width:640px){
  header.top{flex-direction:column;align-items:stretch;gap:10px;}
  nav.tabs{overflow-x:auto;}
  .weeknav{width:100%;margin-left:0;}
  .weekstrip{overflow-x:auto;width:100%;}
  .rowgrid{grid-template-columns:52px 68px 1fr 28px 28px 16px;gap:6px;}
  .tablehead{grid-template-columns:52px 68px 1fr 28px 28px 16px;gap:6px;}
  .libcard .lh{grid-template-columns:16px 1fr 76px 70px auto;gap:6px;}
  .libtablehead{grid-template-columns:16px 1fr 76px 70px auto;gap:6px;}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============ local-only config (never synced to cloud) ============ */
/* ============================================================
   团队默认配置 —— 完全可选，不填也完全没问题
   ------------------------------------------------------------
   这三行只是一个"少打两个字"的小捷径，不是必须的步骤：
   Supabase 的 URL / anon key，本来就应该由每个人在网页的"设置"里自己填写保存
   （已经是这样实现的），跟这个 html 文件本身、跟托管在哪个平台都没关系，
   Netlify/GitHub Pages 只是负责"把这个文件放到一个网址上"，不涉及任何配置项。

   如果你不想碰代码：完全可以跳过下面这三行，保持空着。把 Supabase 项目的
   Project URL 和 anon key 这两个值发给组员（微信/文档都行），大家各自打开
   网页后，在"设置 → 云端同步"里自己粘贴一次、保存，然后各自用邮箱注册/登录即可。
   这两个值本来就是 Supabase 设计给前端公开使用的"客户端公钥"，配合已经开启的
   RLS 策略使用是官方标准做法，发给组员看到也没关系。

   如果你不介意打开这个文件改两行代码、想让组员打开页面时这两项已经是预填好的
   （省得每个人都要粘贴一次），也可以填在下面，效果上完全一样，纯粹是省事而已。

   TEAM_DEEPSEEK_KEY 单独说明（默认建议留空）：
     这个不一样，是一个真正会花钱的密钥，写在这里的话谁打开"查看网页源代码"都能看到并占用。
     默认留空，让每个组员在自己的"设置"里填各自的 DeepSeek Key，最安全、成本各自承担。
     ⚠️ 另外要注意：这个文件一旦离开 Claude 的预览环境（比如部署到 GitHub Pages / Netlify），
        "内置 AI（无需 Key）"这个兜底选项就会失效——那是 Claude 预览环境专属的能力。
        所以部署出去之后，想用 AI 解析就必须配 DeepSeek Key（自己配或者团队统一配），
        没配的人一样能正常用，只是新建事项时改用"手动创建"。
   ============================================================ */
const TEAM_SUPABASE_URL = '';
const TEAM_SUPABASE_ANON_KEY = '';
const TEAM_DEEPSEEK_KEY = '';

function defaultConfig(){
  return { aiProvider: TEAM_DEEPSEEK_KEY ? 'deepseek' : 'claude', deepseekKey: TEAM_DEEPSEEK_KEY,
    supabaseUrl: TEAM_SUPABASE_URL, supabaseAnonKey: TEAM_SUPABASE_ANON_KEY,
    accessToken:'', refreshToken:'', userId:'', userEmail:'', tokenExpiry:0 };
}
function hasClaudeStorage(){
  try{ return typeof window.storage !== 'undefined' && window.storage !== null && typeof window.storage.get === 'function'; }
  catch(e){ return false; }
}
async function loadConfig(){
  const def = defaultConfig();
  try{
    if(hasClaudeStorage()){
      const r = await window.storage.get('wt:config', false);
      if(r && r.value!=null) return Object.assign(def, JSON.parse(r.value));
    } else {
      const v = window.localStorage.getItem('wt:config');
      if(v) return Object.assign(def, JSON.parse(v));
    }
  }catch(e){ /* fall through to default */ }
  return def;
}
async function saveConfig(){
  try{
    if(hasClaudeStorage()) await window.storage.set('wt:config', JSON.stringify(S.config), false);
    else window.localStorage.setItem('wt:config', JSON.stringify(S.config));
  }catch(e){ console.error(e); }
}

/* ============ cloud (Supabase REST, plain fetch, no SDK) ============ */
function cloudConfigured(){ return !!(S.config.supabaseUrl && S.config.supabaseAnonKey); }
function cloudLoggedIn(){ return cloudConfigured() && !!S.config.accessToken && !!S.config.userId; }

async function tryRefreshToken(){
  if(!S.config.refreshToken || !cloudConfigured()) return false;
  try{
    const res = await fetch(`${S.config.supabaseUrl}/auth/v1/token?grant_type=refresh_token`, {
      method:'POST', headers:{apikey:S.config.supabaseAnonKey,'Content-Type':'application/json'},
      body: JSON.stringify({refresh_token:S.config.refreshToken})
    });
    if(!res.ok) return false;
    const data = await res.json();
    S.config.accessToken = data.access_token;
    S.config.refreshToken = data.refresh_token || S.config.refreshToken;
    S.config.tokenExpiry = Date.now() + (data.expires_in||3600)*1000;
    await saveConfig();
    return true;
  }catch(e){ return false; }
}
async function signUpPassword(email, password){
  const res = await fetch(`${S.config.supabaseUrl}/auth/v1/signup`, {
    method:'POST', headers:{apikey:S.config.supabaseAnonKey,'Content-Type':'application/json'},
    body: JSON.stringify({email, password})
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.msg || data.error_description || JSON.stringify(data));
  if(!data.access_token){
    // no session returned usually means "Confirm email" is still ON in Supabase Auth settings
    throw new Error('注册成功但未直接登录——请去 Supabase 的 Authentication → Sign In/Providers → Email 里关闭 "Confirm email" 开关后重试');
  }
  applySession(data, email);
}
async function signInPassword(email, password){
  const res = await fetch(`${S.config.supabaseUrl}/auth/v1/token?grant_type=password`, {
    method:'POST', headers:{apikey:S.config.supabaseAnonKey,'Content-Type':'application/json'},
    body: JSON.stringify({email, password})
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.msg || data.error_description || JSON.stringify(data));
  applySession(data, email);
}
async function applySession(data, email){
  S.config.accessToken = data.access_token;
  S.config.refreshToken = data.refresh_token;
  S.config.userId = data.user.id;
  S.config.userEmail = email;
  S.config.tokenExpiry = Date.now() + (data.expires_in||3600)*1000;
  await saveConfig();
}
function cloudLogout(){
  S.config.accessToken=''; S.config.refreshToken=''; S.config.userId=''; S.config.userEmail='';
  saveConfig();
}
async function cloudGet(key, retried){
  const url = `${S.config.supabaseUrl}/rest/v1/app_data?user_id=eq.${S.config.userId}&key=eq.${key}&select=value`;
  const res = await fetch(url, {headers:{apikey:S.config.supabaseAnonKey, Authorization:`Bearer ${S.config.accessToken}`}});
  if(res.status===401 && !retried){ if(await tryRefreshToken()) return cloudGet(key,true); throw new Error('未登录或登录已过期'); }
  if(!res.ok) throw new Error('云端读取失败: '+res.status);
  const data = await res.json();
  return data.length ? data[0].value : undefined;
}
async function cloudSet(key, val, retried){
  const url = `${S.config.supabaseUrl}/rest/v1/app_data?on_conflict=user_id,key`;
  const res = await fetch(url, {
    method:'POST',
    headers:{apikey:S.config.supabaseAnonKey, Authorization:`Bearer ${S.config.accessToken}`, 'Content-Type':'application/json', Prefer:'resolution=merge-duplicates,return=minimal'},
    body: JSON.stringify([{user_id:S.config.userId, key, value:val, updated_at:new Date().toISOString()}])
  });
  if(res.status===401 && !retried){ if(await tryRefreshToken()) return cloudSet(key,val,true); throw new Error('未登录或登录已过期'); }
  if(!res.ok) throw new Error('云端写入失败: '+res.status);
}

/* ============ generic storage layer: cloud if logged in, else local ============ */
async function readLocalKey(key){
  try{
    if(hasClaudeStorage()){
      const r = await window.storage.get('wt:'+key, false);
      return (r && r.value!=null) ? JSON.parse(r.value) : undefined;
    } else {
      const v = window.localStorage.getItem('wt:'+key);
      return v ? JSON.parse(v) : undefined;
    }
  }catch(e){ return undefined; }
}
async function loadKey(key, def){
  if(cloudLoggedIn()){
    try{
      const cloudVal = await cloudGet(key);
      if(cloudVal!==undefined) return cloudVal;
      // Cloud is reachable and has genuinely nothing saved for this key. Before treating
      // that as "this is empty", check local storage — if it has something, it most likely
      // means an earlier save silently failed and fell back to local (see saveKey below).
      // Silently returning def here would make that data disappear without any warning.
      const localVal = await readLocalKey(key);
      if(localVal!==undefined){
        showToast('⚠️ 云端还没有这份「'+key+'」数据，已用本地备份显示，正在尝试同步到云端…');
        cloudSet(key, localVal).catch(e=>console.warn('background sync-up failed', e));
        return localVal;
      }
      return def;
    }catch(e){ console.warn('cloud load failed, falling back to local', e); }
  }
  const localVal = await readLocalKey(key);
  return localVal!==undefined ? localVal : def;
}
async function saveKey(key, val){
  if(cloudLoggedIn()){
    try{ await cloudSet(key, val); return; }
    catch(e){ console.warn('cloud save failed, saved locally instead', e); showToast('云端保存失败，已临时保存到本地：'+e.message); }
  }
  try{
    if(hasClaudeStorage()) await window.storage.set('wt:'+key, JSON.stringify(val), false);
    else window.localStorage.setItem('wt:'+key, JSON.stringify(val));
  }catch(e){ console.error(e); }
}

function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
function todayStr(){ return fmtDate(new Date()); }
function fmtDate(d){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${dd}`; }
function addDays(d,n){ const nd=new Date(d); nd.setDate(nd.getDate()+n); return nd; }
function parseDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
const WEEKDAY_NAMES_FULL=['周一','周二','周三','周四','周五','周六','周日'];
function isoWeekday(d){ const w=d.getDay(); return w===0?6:w-1; }
function mondayOfWeek(d){ const wd=isoWeekday(d); return addDays(d,-wd); }

function nthWeekdayOfMonth(year,monthIdx,weekday,n){
  const first=new Date(year,monthIdx,1);
  const firstWd=isoWeekday(first);
  let offset=(weekday-firstWd+7)%7;
  if(n>0){
    const day=1+offset+(n-1)*7;
    const d=new Date(year,monthIdx,day);
    if(d.getMonth()!==monthIdx) return null;
    return d;
  }else{
    const last=new Date(year,monthIdx+1,0);
    const lastWd=isoWeekday(last);
    const back=(lastWd-weekday+7)%7;
    return new Date(year,monthIdx+1,0-back);
  }
}
function nthWorkdayOfMonth(year,monthIdx,n){
  let count=0,day=1;
  const daysInMonth=new Date(year,monthIdx+1,0).getDate();
  while(day<=daysInMonth){
    const d=new Date(year,monthIdx,day);
    const wd=d.getDay();
    if(wd!==0 && wd!==6){ count++; if(count===n) return d; }
    day++;
  }
  return null;
}
function timeToMin(t){ if(!t) return null; const [h,m]=t.split(':').map(Number); return h*60+m; }

let S = {
  config: defaultConfig(),
  templates:[], projects:[], instances:[], cycles:[],
  dropdowns:{stakeholders:[], eventNames:[]},
  takeawaysByName:{},
  freeTakeaways:[],
  todayOrder:{date:null, order:[]},

async function loadAll(){
  S.templates = await loadKey('templates', []);
  S.projects = await loadKey('projects', []);
  S.instances = await loadKey('instances', []);
  S.cycles = await loadKey('cycles', []);
  S.dropdowns = await loadKey('dropdowns', {stakeholders:[], eventNames:[]});
  S.takeawaysByName = await loadKey('takeawaysByName', {});
  S.freeTakeaways = await loadKey('freeTakeaways', []);
  S.todayOrder = await loadKey('todayOrder', {date:null, order:[]});
  S.raw = await loadKey('raw', []);
  if(S.todayOrder.date !== todayStr()) S.todayOrder = {date:todayStr(), order:[]};
  // One-time migrations from the old "one shared recurrence + per-step day offset" model to the
  // new "each step has its own independent recurrence rule" model. Safe to run on every load —
  // both are no-ops once a template/cycle has already been migrated.
  const templatesChanged = migrateTemplatesToPerStepRecurrence();
  const cyclesChanged = migrateCyclesToFlatSteps();
  if(templatesChanged) await persist('templates');
  if(cyclesChanged) await persist('cycles');
}
// Old shape: t.recurrence (shared) + step.offsetDays (relative to the shared anchor).
// New shape: each step carries its own independent step.repeat rule.
// For offset=0 steps this is an exact conversion. For nonzero offsets on a weekly rule we shift
// the weekday selection to match; for other frequencies we shift the rule's start date instead
// (an approximation — the day-of-month/nth-weekday pattern itself isn't shifted) since a fully
// generic date-offset-to-rule conversion isn't reliable for every recurrence type.
function migrateTemplatesToPerStepRecurrence(){
  let changed = false;
  S.templates.forEach(t=>{
    if(t.recurrence){
      const base = t.recurrence;
      (t.steps||[]).forEach(st=>{
        if(!st.repeat){
          const offset = st.offsetDays||0;
          let rec = JSON.parse(JSON.stringify(base));
          if(offset!==0){
            if(rec.freq==='weekly' && Array.isArray(rec.weekdays)){
              const shift = ((offset%7)+7)%7;
              rec.weekdays = rec.weekdays.map(wd=>(wd+shift)%7);
            } else if(rec.rangeStart){
              rec.rangeStart = fmtDate(addDays(parseDate(rec.rangeStart), offset));
            }
          }
          st.repeat = rec;
          delete st.offsetDays;
          changed = true;
        }
      });
      delete t.recurrence;
      changed = true;
    }
  });
  return changed;
}
// Old shape: one row per anchor date, bundling every step's occurrence together (c.steps=[...]).
// New shape: one flat row per (step, occurrence date) — c IS the occurrence, no bundling.
// This also preserves each step-occurrence's done/skipped status and content exactly as it was.
function migrateCyclesToFlatSteps(){
  let changed = false;
  const flat = [];
  S.cycles.forEach(c=>{
    if(c.steps){
      changed = true;
      c.steps.forEach(st=>{
        flat.push({
          id: st.id, templateId: c.templateId, stepDefId: st.stepDefId||null,
          date: st.date, content: st.content, time: st.time, noTime: st.noTime,
          status: st.status, skipped: !!st.skipped || !!c.skipped,
          reminder: st.reminder!==false, createdAt: c.createdAt||Date.now()
        });
      });
    } else {
      flat.push(c);
    }
  });
  S.cycles = flat;
  return changed;
}
async function persist(part){
  const keys = ['templates','projects','instances','cycles','dropdowns','takeawaysByName','freeTakeaways','todayOrder','raw'];
  if(part){ await saveKey(part, S[part]); }
  else{ for(const k of keys) await saveKey(k, S[k]); }
}

/* ============ recurrence engine (Outlook-style: freq/interval/pattern/range) ============ */
function defaultRecurrence(){
  return {
    freq:'weekly', interval:1,
    weekdays:[0], // ISO Mon=0..Sun=6, used by weekly
    monthlyMode:'dayOfMonth', dayOfMonth:1, nthN:1, nthWeekday:0,
    yearlyMode:'date', yearMonth:1, yearDay:1,
    rangeStart: todayStr(),
    rangeEnd: {type:'never', until:'', count:12}
  };
}
function matchesRecurrence(rec, date, rangeStartDate){
  const diffDays = Math.round((date - rangeStartDate)/86400000);
  if(diffDays < 0) return false;
  const interval = Math.max(1, rec.interval||1);
  if(rec.freq==='daily'){
    return diffDays % interval === 0;
  }
  if(rec.freq==='weekly'){
    const startMon = mondayOfWeek(rangeStartDate);
    const dateMon = mondayOfWeek(date);
    const weeksDiff = Math.round((dateMon-startMon)/(7*86400000));
    if(weeksDiff % interval !== 0) return false;
    const wd = isoWeekday(date);
    const wds = (rec.weekdays && rec.weekdays.length) ? rec.weekdays : [isoWeekday(rangeStartDate)];
    return wds.includes(wd);
  }
  if(rec.freq==='monthly'){
    const monthsDiff = (date.getFullYear()-rangeStartDate.getFullYear())*12 + (date.getMonth()-rangeStartDate.getMonth());
    if(monthsDiff < 0 || monthsDiff % interval !== 0) return false;
    if(rec.monthlyMode==='dayOfMonth'){
      const lastDay = new Date(date.getFullYear(), date.getMonth()+1, 0).getDate();
      return date.getDate() === Math.min(rec.dayOfMonth||1, lastDay);
    } else if(rec.monthlyMode==='nthWorkday'){
      const target = nthWorkdayOfMonth(date.getFullYear(), date.getMonth(), rec.nthN);
      return target && fmtDate(target)===fmtDate(date);
    } else {
      const target = nthWeekdayOfMonth(date.getFullYear(), date.getMonth(), rec.nthWeekday, rec.nthN);
      return target && fmtDate(target)===fmtDate(date);
    }
  }
  if(rec.freq==='yearly'){
    const yearsDiff = date.getFullYear()-rangeStartDate.getFullYear();
    if(yearsDiff < 0 || yearsDiff % interval !== 0) return false;
    if((date.getMonth()+1) !== (rec.yearMonth||1)) return false;
    if(rec.yearlyMode==='date'){
      return date.getDate() === (rec.yearDay||1);
    } else {
      const target = nthWeekdayOfMonth(date.getFullYear(), (rec.yearMonth||1)-1, rec.nthWeekday, rec.nthN);
      return target && fmtDate(target)===fmtDate(date);
    }
  }
  return false;
}
function generateAnchorsInWindow(rec, windowStart, windowEnd){
  const rangeStartDate = rec.rangeStart ? parseDate(rec.rangeStart) : windowStart;
  const untilDate = (rec.rangeEnd && rec.rangeEnd.type==='until' && rec.rangeEnd.until) ? parseDate(rec.rangeEnd.until) : null;
  const maxCount = (rec.rangeEnd && rec.rangeEnd.type==='count' && rec.rangeEnd.count) ? rec.rangeEnd.count : Infinity;
  const hardStopCap = addDays(rangeStartDate, 366*3); // safety cap: scan at most 3 years ahead
  const scanEnd = windowEnd < hardStopCap ? windowEnd : hardStopCap;
  const results = [];
  let count = 0;
  let cursor = new Date(rangeStartDate);
  let iterations = 0;
  while(cursor <= scanEnd && iterations < 4000){
    iterations++;
    if(untilDate && cursor > untilDate) break;
    if(matchesRecurrence(rec, cursor, rangeStartDate)){
      count++;
      if(count > maxCount) break;
      if(cursor >= windowStart && cursor <= windowEnd) results.push(fmtDate(cursor));
    }
    cursor = addDays(cursor, 1);
  }
  return results;
}
function recurrenceSummary(rec){
  const iv = rec.interval||1;
  let core = '';
  if(rec.freq==='daily') core = iv===1? '每天' : `每${iv}天`;
  else if(rec.freq==='weekly'){
    const days = (rec.weekdays&&rec.weekdays.length? rec.weekdays: [0]).map(w=>WEEKDAY_NAMES_FULL[w]).join('、');
    core = (iv===1? '每周 ':`每${iv}周 `) + days;
  } else if(rec.freq==='monthly'){
    let modeTxt;
    if(rec.monthlyMode==='dayOfMonth') modeTxt = `${rec.dayOfMonth}号`;
    else if(rec.monthlyMode==='nthWorkday') modeTxt = `第${rec.nthN}个工作日`;
    else modeTxt = `第${rec.nthN===-1?'最后一':rec.nthN}周${WEEKDAY_NAMES_FULL[rec.nthWeekday]}`;
    core = (iv===1?'每月':`每${iv}个月`) + ` ${modeTxt}`;
  } else if(rec.freq==='yearly'){
    core = (iv===1?'每年':`每${iv}年`) + ` ${rec.yearMonth}月` + (rec.yearlyMode==='date'? `${rec.yearDay}号` : `第${rec.nthN===-1?'最后一':rec.nthN}周${WEEKDAY_NAMES_FULL[rec.nthWeekday]}`);
  }
  let rangeTxt = `，从 ${rec.rangeStart} 开始`;
  if(rec.rangeEnd){
    if(rec.rangeEnd.type==='until' && rec.rangeEnd.until) rangeTxt += `，到 ${rec.rangeEnd.until} 结束`;
    else if(rec.rangeEnd.type==='count' && rec.rangeEnd.count) rangeTxt += `，重复 ${rec.rangeEnd.count} 次后结束`;
    else rangeTxt += '，无结束日期';
  }
  return core + rangeTxt;
}

function wireRecurrenceFields(container, prefix, rec, onChange){
  function updateSummary(){
    const s = container.querySelector('#'+prefix+'Summary');
    if(s) s.textContent = recurrenceSummary(rec);
    if(onChange) onChange();
  }
  function renderPatternFields(){
    const wrap = container.querySelector('#'+prefix+'PatternWrap');
    if(rec.freq==='daily'){
      wrap.innerHTML = '';
    } else if(rec.freq==='weekly'){
      wrap.innerHTML = `<div class="field"><label>在这些天发生</label>
        <div class="checkline" style="flex-wrap:wrap;">
          ${WEEKDAY_NAMES_FULL.map((w,i)=>`<label style="margin-right:8px;"><input type="checkbox" data-wd="${i}" ${rec.weekdays.includes(i)?'checked':''}> ${w}</label>`).join('')}
        </div></div>`;
      wrap.querySelectorAll('[data-wd]').forEach(cb=>{
        cb.onchange = ()=>{
          const wd = +cb.dataset.wd;
          if(cb.checked){ if(!rec.weekdays.includes(wd)) rec.weekdays.push(wd); }
          else { rec.weekdays = rec.weekdays.filter(x=>x!==wd); }
          updateSummary();
        };
      });
    } else if(rec.freq==='monthly'){
      wrap.innerHTML = `<div class="field"><label>规则类型</label><select id="${prefix}MonMode">
          <option value="dayOfMonth" ${rec.monthlyMode==='dayOfMonth'?'selected':''}>每月第几号</option>
          <option value="nthWeekday" ${rec.monthlyMode==='nthWeekday'?'selected':''}>每月第几周星期几</option>
          <option value="nthWorkday" ${rec.monthlyMode==='nthWorkday'?'selected':''}>每月第几个工作日</option>
        </select></div>
        <div class="inline" id="${prefix}MonExtra"></div>`;
      function renderMonExtra(){
        const ex = container.querySelector('#'+prefix+'MonExtra');
        if(rec.monthlyMode==='dayOfMonth'){
          ex.innerHTML = `<div class="field"><label>号数</label><input type="number" min="1" max="31" id="${prefix}MonDay" value="${rec.dayOfMonth}"></div>`;
          ex.querySelector('#'+prefix+'MonDay').onchange = e=>{ rec.dayOfMonth=Number(e.target.value); updateSummary(); };
        } else if(rec.monthlyMode==='nthWeekday'){
          ex.innerHTML = `<div class="field"><label>第几周（-1=最后一周）</label><input type="number" min="-1" max="5" id="${prefix}MonN" value="${rec.nthN}"></div>
            <div class="field"><label>星期几</label><select id="${prefix}MonWd">${WEEKDAY_NAMES_FULL.map((w,i)=>`<option value="${i}" ${rec.nthWeekday===i?'selected':''}>${w}</option>`).join('')}</select></div>`;
          ex.querySelector('#'+prefix+'MonN').onchange = e=>{ rec.nthN=Number(e.target.value); updateSummary(); };
          ex.querySelector('#'+prefix+'MonWd').onchange = e=>{ rec.nthWeekday=Number(e.target.value); updateSummary(); };
        } else {
          ex.innerHTML = `<div class="field"><label>第几个工作日</label><input type="number" min="1" max="23" id="${prefix}MonWorkN" value="${rec.nthN}"></div>`;
          ex.querySelector('#'+prefix+'MonWorkN').onchange = e=>{ rec.nthN=Number(e.target.value); updateSummary(); };
        }
      }
      container.querySelector('#'+prefix+'MonMode').onchange = e=>{ rec.monthlyMode=e.target.value; renderMonExtra(); updateSummary(); };
      renderMonExtra();
    } else if(rec.freq==='yearly'){
      wrap.innerHTML = `<div class="inline">
          <div class="field"><label>月份</label><select id="${prefix}YrMonth">${Array.from({length:12},(_,i)=>i+1).map(m=>`<option value="${m}" ${rec.yearMonth===m?'selected':''}>${m}月</option>`).join('')}</select></div>
          <div class="field"><label>规则类型</label><select id="${prefix}YrMode">
            <option value="date" ${rec.yearlyMode==='date'?'selected':''}>具体号数</option>
            <option value="nthWeekday" ${rec.yearlyMode==='nthWeekday'?'selected':''}>第几周星期几</option>
          </select></div>
        </div>
        <div class="inline" id="${prefix}YrExtra"></div>`;
      function renderYrExtra(){
        const ex = container.querySelector('#'+prefix+'YrExtra');
        if(rec.yearlyMode==='date'){
          ex.innerHTML = `<div class="field"><label>号数</label><input type="number" min="1" max="31" id="${prefix}YrDay" value="${rec.yearDay}"></div>`;
          ex.querySelector('#'+prefix+'YrDay').onchange = e=>{ rec.yearDay=Number(e.target.value); updateSummary(); };
        } else {
          ex.innerHTML = `<div class="field"><label>第几周（-1=最后一周）</label><input type="number" min="-1" max="5" id="${prefix}YrN" value="${rec.nthN}"></div>
            <div class="field"><label>星期几</label><select id="${prefix}YrWd">${WEEKDAY_NAMES_FULL.map((w,i)=>`<option value="${i}" ${rec.nthWeekday===i?'selected':''}>${w}</option>`).join('')}</select></div>`;
          ex.querySelector('#'+prefix+'YrN').onchange = e=>{ rec.nthN=Number(e.target.value); updateSummary(); };
          ex.querySelector('#'+prefix+'YrWd').onchange = e=>{ rec.nthWeekday=Number(e.target.value); updateSummary(); };
        }
      }
      container.querySelector('#'+prefix+'YrMonth').onchange = e=>{ rec.yearMonth=Number(e.target.value); updateSummary(); };
      container.querySelector('#'+prefix+'YrMode').onchange = e=>{ rec.yearlyMode=e.target.value; renderYrExtra(); updateSummary(); };
      renderYrExtra();
    }
  }
  container.querySelector('#'+prefix+'Freq').onchange = e=>{ rec.freq=e.target.value; renderPatternFields(); updateSummary(); };
  container.querySelector('#'+prefix+'Interval').onchange = e=>{ rec.interval=Math.max(1, Number(e.target.value)||1); updateSummary(); };
  container.querySelector('#'+prefix+'Start').onchange = e=>{ rec.rangeStart = e.target.value || todayStr(); updateSummary(); };
  container.querySelector('#'+prefix+'EndType').onchange = e=>{
    rec.rangeEnd.type = e.target.value;
    container.querySelector('#'+prefix+'UntilWrap').style.display = rec.rangeEnd.type==='until'?'block':'none';
    container.querySelector('#'+prefix+'CountWrap').style.display = rec.rangeEnd.type==='count'?'block':'none';
    updateSummary();
  };
  container.querySelector('#'+prefix+'Until').onchange = e=>{ rec.rangeEnd.until=e.target.value; updateSummary(); };
  container.querySelector('#'+prefix+'Count').onchange = e=>{ rec.rangeEnd.count=Number(e.target.value)||1; updateSummary(); };
  renderPatternFields();
}

/* ============ per-step recurrence generation ============ */
// S.cycles now holds one row per (template step, occurrence date) — flat, not bundled by a
// shared anchor — since different steps in the same 周期事项 can run on entirely different
// schedules (weekly / monthly / yearly) that have nothing to do with each other.
function ensureCyclesGenerated(){
  const today = new Date();
  const windowStart = addDays(today, -21);
  const windowEnd = addDays(today, 60);
  for(const t of S.templates){
    (t.steps||[]).forEach(st=>{
      if(!st.repeat) return; // guard: shouldn't happen post-migration, but don't crash if it does
      const dates = generateAnchorsInWindow(st.repeat, windowStart, windowEnd);
      dates.forEach(dateStr=>{
        if(S.cycles.find(c=>c.templateId===t.id && c.stepDefId===st.id && c.date===dateStr)) return;
        S.cycles.push({
          id:uid(), templateId:t.id, stepDefId:st.id, date:dateStr,
          content:st.content, time: st.noTime? null : st.time, noTime: !!st.noTime,
          reminder: st.reminder!==false, status:'todo', skipped:false, createdAt:Date.now()
        });
      });
    });
  }
}

/* ============ unified feed rows (today/week) ============ */
function buildRowsForDate(dateStr){
  const rows=[];
  for(const c of S.cycles){
    if(c.skipped) continue;
    if(c.date!==dateStr) continue; // recurring steps only show on their own scheduled day — no carry-forward when overdue
    const t = S.templates.find(x=>x.id===c.templateId);
    if(!t) continue;
    rows.push({ key:`cycle:${c.id}`, kind:'recurringStep', category:'recurring',
      title:c.content, parentName:t.name, stakeholder:t.stakeholder, time:c.time, noTime:c.noTime,
      status:c.status, createdAt:c.createdAt, overdueDays:0,
      refCycle:c, refStep:c, refTemplate:t });
  }
  for(const inst of S.instances){
    const due = inst.dueDate || null;
    const isDone = inst.status==='done';
    let showToday;
    if(due){
      showToday = due===dateStr || (!isDone && due<dateStr && dateStr===todayStr());
    } else {
      showToday = isDone ? (inst.completedDate===dateStr) : (dateStr===todayStr());
    }
    if(!showToday) continue;
    rows.push({ key:`adhoc:${inst.id}`, kind:'adhoc', category:'adhoc',
      title:inst.title, stakeholder:inst.stakeholder, time:inst.time, noTime:inst.noTime,
      status:inst.status, createdAt:inst.createdAt, overdueDays: due && due<dateStr ? diffDays(due,dateStr) : 0,
      refInstance:inst });
  }
  for(const p of S.projects){
    if(p.status==='已结束') continue;
    (p.steps||[]).forEach(next=>{
      const due = next.date || null;
      const isDone = next.status==='done';
      let showToday;
      if(due){
        showToday = due===dateStr || (!isDone && due<dateStr && dateStr===todayStr());
      } else {
        showToday = isDone ? (next.completedDate===dateStr) : (dateStr===todayStr());
      }
      if(!showToday) return;
      rows.push({ key:`project:${p.id}:step:${next.id}`, kind:'projectNext', category:'project',
        title:next.content, parentName:p.name, stakeholder:p.stakeholder, time:next.time, noTime: !next.time,
        status:next.status, createdAt:p.createdAt, overdueDays: due && due<dateStr? diffDays(due,dateStr):0,
        refProject:p, refStep:next });
    });
  }
  return rows;
}
function diffDays(dateStr, refStr){ const a=parseDate(dateStr), b=parseDate(refStr); return Math.max(0, Math.round((b-a)/86400000)); }

function sortRows(rows, isToday){
  const timed = rows.filter(r=>r.time && !r.noTime);
  const untimed = rows.filter(r=>!r.time || r.noTime);
  timed.sort((a,b)=> timeToMin(a.time)-timeToMin(b.time));
  untimed.sort((a,b)=> a.createdAt-b.createdAt);
  let ordered = [...timed, ...untimed];
  if(isToday && S.todayOrder.date===todayStr() && S.todayOrder.order.length){
    const orderMap = {}; S.todayOrder.order.forEach((k,i)=>orderMap[k]=i);
    ordered = ordered.slice().sort((a,b)=>{
      const ia = orderMap[a.key], ib = orderMap[b.key];
      if(ia!==undefined && ib!==undefined) return ia-ib;
      if(ia!==undefined) return -1;
      if(ib!==undefined) return 1;
      return 0;
    });
  }
  return ordered;
}

// a plain string from before this change — these helpers make every read site tolerant of both,
// so old data keeps working without a hard migration step; anything re-saved upgrades naturally.
function stkArr(v){
  if(Array.isArray(v)) return v.filter(Boolean);
  if(typeof v==='string' && v.trim()) return [v.trim()];
  return [];
}
function stkLabel(v){ return stkArr(v).join('、'); }
// Multi-select 需求方 input: shows current picks as removable chips, plus a text field
// (with the curated-list datalist) to add more — type a name and press Enter, or blur, to add it.
function renderStakeholderPicker(initial, onChange){
  const arr = stkArr(initial);
  const wrap = el(`<div class="stkpicker"></div>`);
  function paint(focusInput){
    wrap.innerHTML = `
      <div class="stkchips">${arr.map((s,i)=>`<span class="chip sm" data-rm="${i}">${s}<button type="button">✕</button></span>`).join('')}</div>
      <input type="text" list="globalStkList" placeholder="输入需求方，回车可加多个">
    `;
    wrap.querySelectorAll('[data-rm]').forEach(c=>{
      c.querySelector('button').onclick = ()=>{ arr.splice(+c.dataset.rm,1); paint(); if(onChange) onChange([...arr]); };
    });
    const inp = wrap.querySelector('input');
    const commit = ()=>{
      const v = inp.value.trim();
      if(v && !arr.includes(v)) arr.push(v);
      inp.value='';
      paint(true);
      if(onChange) onChange([...arr]);
    };
    inp.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); commit(); } };
    inp.onblur = ()=>{ if(inp.value.trim()) commit(); };
    if(focusInput) inp.focus();
  }
  paint(false);
  wrap.getValue = ()=> [...arr];
  wrap.setValue = (newArr)=>{ arr.length=0; arr.push(...stkArr(newArr)); paint(false); };
  return wrap;
}

function wireRowDrag(row, r, movable){

  row.addEventListener('dragend', ()=>{ row.classList.remove('dragging'); dragState.key=null; });
  row.addEventListener('dragover', (e)=>{ e.preventDefault(); row.classList.add('dragover'); });
  row.addEventListener('dragleave', ()=>{ row.classList.remove('dragover'); });
  row.addEventListener('drop', (e)=>{
    e.preventDefault(); row.classList.remove('dragover');

    if(!fromKey || fromKey===r.key) return;
    reorderTodayRows(fromKey, r.key);

let dragState = { key:null };
function reorderTodayRows(fromKey, toKey){
  const rows = sortRows(applyWhoFilter(buildRowsForDate(todayStr())), true);
  let order = rows.map(r=>r.key);
  const fromI = order.indexOf(fromKey), toI = order.indexOf(toKey);
  if(fromI<0 || toI<0) return;
  order.splice(fromI,1);
  order.splice(toI,0,fromKey);
  S.todayOrder = {date:todayStr(), order};
  persist('todayOrder'); render();
}
function renderRowMenu(items){

  pop.innerHTML = items.map((it,i)=>`<button data-idx="${i}">${it.label}</button>`).join('');

  pop.querySelectorAll('[data-idx]').forEach((b,i)=>{ b.onclick=(e)=>{ e.stopPropagation(); pop.style.display='none'; items[i].onClick(); }; });

}

function toggleRow(r){
  const nowDone = r.status!=='done';
  if(r.kind==='recurringStep'){ r.refStep.status = nowDone?'done':'todo'; persist('cycles'); }
  else if(r.kind==='adhoc'){
    r.refInstance.status = nowDone?'done':'todo';
    if(!r.refInstance.dueDate) r.refInstance.completedDate = nowDone ? todayStr() : null;
    if(nowDone && r.refInstance.repeat){
      const next = nextRepeatDate(r.refInstance.repeat, r.refInstance.dueDate||todayStr());
      if(next){ r.refInstance.dueDate = next; r.refInstance.status='todo'; r.refInstance.completedDate=null; }
    }
    persist('instances');
  }
  else if(r.kind==='projectNext'){
    r.refStep.status = nowDone?'done':'todo';
    if(!r.refStep.date) r.refStep.completedDate = nowDone ? todayStr() : null;
    persist('projects');
  }
  render();
}

  wrap.innerHTML = filtered.map(e=>`<div class="ta-item">${e.content}${e.tags&&e.tags.length?`<div class="ta-tags">${e.tags.map(t=>`<span>${t}</span>`).join('')}</div>`:''}</div>`).join('');
  return wrap;
}
function nextRepeatDate(rec, fromDateStr){
  if(!rec) return fromDateStr;
  const from = parseDate(fromDateStr || todayStr());
  const searchStart = addDays(from, 1);
  const searchEnd = addDays(from, 400);
  const results = generateAnchorsInWindow(rec, searchStart, searchEnd);
  return results.length ? results[0] : null; // null = series exhausted (hit end date/count)
}
// When a step gets a repeat rule but no explicit date was picked, it needs SOME real date to
// anchor to — otherwise it has no due date at all and (per the "undated items float to today"
// rule) would incorrectly sit on "today" forever instead of showing on its real next occurrence.
function firstOccurrenceDate(rec){
  if(!rec) return null;
  const start = rec.rangeStart ? parseDate(rec.rangeStart) : new Date();
  const results = generateAnchorsInWindow(rec, start, addDays(start, 400));
  return results.length ? results[0] : null;
}
function repeatLabel(rec){
  if(!rec) return '';
  return '🔁 '+recurrenceSummary(rec);
}

// Multi-select 标签 input — same chip UI as the stakeholder picker, but suggests from
// all tags ever used across takeaway entries, and supports true append (not replace).
function renderTagPicker(initial, onChange){
  const arr = Array.isArray(initial) ? initial.filter(Boolean) : (typeof initial==='string' ? initial.split(',').map(s=>s.trim()).filter(Boolean) : []);
  const wrap = el(`<div class="stkpicker"></div>`);
  function paint(focusInput){
    wrap.innerHTML = `
      <div class="stkchips">${arr.map((s,i)=>`<span class="chip sm" data-rm="${i}">${s}<button type="button">✕</button></span>`).join('')}</div>
      <input type="text" list="globalTagList" placeholder="输入标签，回车可加多个">
    `;
    wrap.querySelectorAll('[data-rm]').forEach(c=>{
      c.querySelector('button').onclick = ()=>{ arr.splice(+c.dataset.rm,1); paint(); if(onChange) onChange([...arr]); };
    });
    const inp = wrap.querySelector('input');
    const commit = ()=>{
      const v = inp.value.trim();
      if(v && !arr.includes(v)) arr.push(v);
      inp.value='';
      paint(true);
      if(onChange) onChange([...arr]);
    };
    inp.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); commit(); } };
    inp.onblur = ()=>{ if(inp.value.trim()) commit(); };
    if(focusInput) inp.focus();
  }
  paint(false);
  wrap.getValue = ()=> [...arr];
  wrap.setValue = (newArr)=>{ arr.length=0; arr.push(...(Array.isArray(newArr)?newArr.filter(Boolean):[])); paint(false); };
  return wrap;
}
function collectAllTakeaways(){
  const list = [];
  S.templates.forEach(t=> (t.takeaways||[]).forEach(e=> list.push({...e, source:t.name, sourceKind:'周期事项', sourceId:t.id, navKind:'recurring'})));
  S.projects.forEach(p=> (p.takeaways||[]).forEach(e=> list.push({...e, source:p.name, sourceKind:'项目', sourceId:p.id, navKind:'project'})));
  Object.keys(S.takeawaysByName).forEach(name=> (S.takeawaysByName[name]||[]).forEach(e=> list.push({...e, source:'按需事项经验归档', sourceKind:'按需事项', sourceId:'adhoc_all', navKind:'name', stepLabel: e.stepLabel||name})));
  (S.freeTakeaways||[]).forEach(e=> list.push({...e, source:'自由记录', sourceKind:'自由记录', sourceId:'free', navKind:'free'}));
  // 标签就是类别: fold any leftover legacy `category` value (from an earlier version of this
  // feature) into the tags array, so nothing gets silently dropped now that they're unified.
  return list.map(e=>{
    if(e.category && !(e.tags||[]).includes(e.category)) return {...e, tags:[...(e.tags||[]), e.category]};
    return e;
  }).sort((a,b)=>b.createdAt-a.createdAt);
}
// All tags ever used across every takeaway entry, for the shared 标签 datalist.
function allTakeawayTags(){
  const set = new Set();
  collectAllTakeaways().forEach(e=>(e.tags||[]).forEach(t=>{ if(t) set.add(t); }));
  return [...set];
}
// When an adhoc item that already has takeaway history gets converted into a project/template
// step, its existing takeaways need to move with it — otherwise they'd stay orphaned under the
// old title in S.takeawaysByName even though the item itself no longer lives there.
function moveAdhocTakeaways(title, targetObj){
  const moved = S.takeawaysByName[title];
  if(moved && moved.length){
    targetObj.takeaways = targetObj.takeaways || [];
    targetObj.takeaways.push(...moved);
    delete S.takeawaysByName[title];
    persist('takeawaysByName');
  }
}
function deleteTakeawayEntry(e){
  if(e.sourceKind==='周期事项'){
    const t = S.templates.find(x=>x.id===e.sourceId);
    if(t){ t.takeaways = (t.takeaways||[]).filter(x=>x.id!==e.id); persist('templates'); }
  } else if(e.sourceKind==='项目'){
    const p = S.projects.find(x=>x.id===e.sourceId);
    if(p){ p.takeaways = (p.takeaways||[]).filter(x=>x.id!==e.id); persist('projects'); }
  } else if(e.sourceKind==='按需事项'){
    const key = e.stepLabel;
    if(key && S.takeawaysByName[key]){
      S.takeawaysByName[key] = S.takeawaysByName[key].filter(x=>x.id!==e.id);
      persist('takeawaysByName');
    }
  } else if(e.sourceKind==='自由记录'){
    S.freeTakeaways = (S.freeTakeaways||[]).filter(x=>x.id!==e.id);
    persist('freeTakeaways');
  }
}

          date: pendingStepDt.date || (pendingStepRec ? firstOccurrenceDate(pendingStepRec) : null),
          time: pendingStepDt.noTime? null : (pendingStepDt.time || null),
          repeat: pendingStepRec,
          status:'todo'
        });
        persist('projects'); ui.openCards['pj_'+p.id]=true; render();
      }
    };
    card.querySelector(`[data-endproj="${p.id}"]`).onclick = ()=>{ p.status = p.status==='已结束'?'进行中':'已结束'; persist('projects'); render(); };
    card.querySelector(`[data-delproj="${p.id}"]`).onclick = ()=>{
      if(confirm(`确定删除项目「${p.name}」吗？这会连同它下面所有的步骤和经验记录一起永久删除，不可恢复。`)){
        S.projects = S.projects.filter(x=>x.id!==p.id);
        persist('projects'); render();
      }
    };
  },0);
  return card;
}

function renderRecurringCard(t){

  const card = el(`<div class="libcard ${open?'open':''}"></div>`);
  const lhHtml = editingMeta ? `
    <div class="lh" style="display:flex;flex-wrap:wrap;align-items:flex-start;cursor:default;">
      <span class="car">▸</span>
      <div style="flex:1;display:flex;flex-direction:column;gap:6px;min-width:220px;">
        <input type="text" class="teName" value="${t.name.replace(/"/g,'&quot;')}" placeholder="事项名称" style="padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--card);font-family:'Source Serif 4',serif;font-size:14.5px;">

      <span class="car">▸</span>
      <h3 data-clickmeta="1" style="cursor:text;">${t.name}</h3>
      <span class="col-who-plain" data-clickmeta="1" style="cursor:text;">${stkLabel(t.stakeholder)||'+ 需求方'}</span>
      <span class="tag cat-recurring">周期性</span>
      <span class="muted mono" style="font-size:11px;text-align:right;">${t.steps.length} 步骤</span>
    </div>`;
  card.innerHTML = lhHtml + `
    <div class="detail">
      <div class="hint" style="margin-bottom:8px;">步骤定义（每个步骤单独设置自己的循环规则，互不影响——可以有的按周、有的按月、有的按年）：</div>
      <div id="tpsteps_${t.id}"></div>
      <div class="btnrow" style="justify-content:flex-start;margin-top:10px;">
        <button class="btn ghost sm" data-edittpl="${t.id}">编辑步骤定义</button>
        <button class="btn ghost sm" data-deltpl="${t.id}" style="color:var(--danger);">删除周期事项</button>
      </div>
    </div>`;
  setTimeout(()=>{
    if(!editingMeta){
      card.querySelector('.lh').onclick = (e)=>{
        if(e.target.closest('[data-clickmeta]')) return;
        ui.openCards['tp_'+t.id]=!ui.openCards['tp_'+t.id]; render();
      };
      card.querySelectorAll('[data-clickmeta]').forEach(elm=>{
        elm.onclick = (e)=>{ e.stopPropagation(); ui.openCards['edittplmeta_'+t.id]=true; render(); };
      });
    } else {
      const teWho = renderStakeholderPicker(t.stakeholder);
      card.querySelector(`#teWhoWrap_${t.id}`).appendChild(teWho);
      card.querySelector('[data-metacancel]').onclick = ()=>{ ui.openCards['edittplmeta_'+t.id]=false; render(); };
      card.querySelector('[data-metasave]').onclick = ()=>{
        const name = card.querySelector('.teName').value.trim();
        if(!name){ alert('事项名称不能为空'); return; }
        t.name = name;
        t.stakeholder = teWho.getValue();
        ui.openCards['edittplmeta_'+t.id]=false;
        persist('templates'); render();
      };
    }
    const stepsEl = card.querySelector(`#tpsteps_${t.id}`);
    t.steps.forEach(st=>{
      const recTxt = st.repeat ? recurrenceSummary(st.repeat) : '未设置循环规则';
      const item = el(`<div class="chain-item"><div class="dot"></div><div class="stxt">${st.content}</div><div class="stime mono">${recTxt} ${st.noTime?'无固定时间':(st.time||'')}</div><button class="iconbtn" title="记录经验" style="margin-left:2px;">💡+</button></div>`);
      item.querySelector('.iconbtn').onclick = ()=> quickAddTakeawayFor('template', t, st.content, st.id);
      const tag = stepTakeawayTag(t.takeaways, st.id);
      if(tag) item.querySelector('.stxt').appendChild(tag);
      stepsEl.appendChild(item);
      const expanded = stepTakeawayExpanded(t.takeaways, st.id);
      if(expanded) stepsEl.appendChild(expanded);
    });
    card.querySelector(`[data-edittpl="${t.id}"]`).onclick = ()=> openTemplateForm(t);
    card.querySelector(`[data-deltpl="${t.id}"]`).onclick = ()=>{
      if(confirm(`确定删除周期事项「${t.name}」吗？这会连同它所有已生成的周期实例和经验记录一起永久删除，不可恢复。`)){
        S.templates = S.templates.filter(x=>x.id!==t.id);
        S.cycles = S.cycles.filter(c=>c.templateId!==t.id);
        persist('templates'); persist('cycles'); render();
      }
    };
  },0);
  return card;
}

/* ============ project form ============ */
function openProjectForm(existing){
  const overlay = el(`<div class="overlay"></div>`);
  overlay.innerHTML = `<div class="modal">
    <h2>${existing?'编辑项目信息':'新建项目'}</h2>
    <div class="field"><label>项目名称${existing?'':'（新建时可以直接打一句话描述，回车让 AI 自动帮你填需求方/截止时间）'}</label><input type="text" id="pName" value="${existing?existing.name:''}" placeholder="例如：投研工作AI开发，下周五前给张总"></div>
    <div class="inline">
      <div class="field"><label>需求方</label><div id="pWhoWrap"></div></div>
      <div class="field"><label>截止时间（可选）</label><input type="date" id="pDeadline" value="${existing&&existing.deadline?existing.deadline:''}"></div>
    </div>
    <div class="btnrow"><button class="btn ghost" id="pCancel">取消</button><button class="btn primary" id="pSave">${existing?'保存':'创建'}</button></div>
  </div>`;
  document.body.appendChild(overlay);
  const pWho = renderStakeholderPicker(existing?existing.stakeholder:'');
  overlay.querySelector('#pWhoWrap').appendChild(pWho);
  if(!existing){
    wireEnterToAIParse(overlay.querySelector('#pName'), (d)=>{
      overlay.querySelector('#pName').value = d.title || overlay.querySelector('#pName').value;
      if(d.stakeholder) pWho.setValue([d.stakeholder]);
      if(d.dueDate) overlay.querySelector('#pDeadline').value = d.dueDate;
    });
  }
  overlay.querySelector('#pCancel').onclick = ()=>overlay.remove();
  overlay.querySelector('#pSave').onclick = ()=>{
    const name = overlay.querySelector('#pName').value.trim();
    if(!name) return;
    if(existing){
      existing.name = name;
      existing.stakeholder = pWho.getValue();
      existing.deadline = overlay.querySelector('#pDeadline').value || null;
    } else {
      S.projects.push({id:uid(), name, stakeholder:pWho.getValue(),
        deadline:overlay.querySelector('#pDeadline').value||null, status:'进行中', createdAt:Date.now(), steps:[], takeaways:[]});
    }
    persist('projects'); overlay.remove(); ui.tab='projects'; render();
  };
}

/* ============ recurring template form ============ */
function openTemplateForm(existing){
  const draft = existing
    ? JSON.parse(JSON.stringify(existing))
    : { name:'', stakeholder:'', steps:[] };
  renderTemplateModal(draft, existing ? existing.id : null);
}
function renderTemplateModal(draft, editId){
  const old = document.getElementById('tplOverlay'); if(old) old.remove();
  const overlay = el(`<div class="overlay" id="tplOverlay"></div>`);
  overlay.innerHTML = `<div class="modal" style="max-width:640px;">
    <h2>${editId?'编辑周期事项':'新建周期事项'}</h2>
    <div class="inline">
      <div class="field"><label>事项名称${editId?'':'（新建时可以直接打一句话描述，回车让 AI 自动帮你填需求方）'}</label><input type="text" id="tName" value="${draft.name}" placeholder="例如：VC组周会组织与会后跟进"></div>
      <div class="field"><label>需求方</label><div id="tWhoWrap"></div></div>
    </div>

    <div class="field"><label>步骤（每个步骤单独设置自己的循环规则——同一个"周期事项"下，有的可以按周、有的按月、有的按年，互不影响）</label><div id="stepList"></div>
      <button class="btn ghost sm" id="addStepBtn" style="margin-top:6px;">+ 添加步骤</button>
    </div>
    <div class="btnrow"><button class="btn ghost" id="tCancel">取消</button><button class="btn primary" id="tSave">保存</button></div>
  </div>`;
  document.body.appendChild(overlay);
  const tWho = renderStakeholderPicker(draft.stakeholder);
  overlay.querySelector('#tWhoWrap').appendChild(tWho);
  if(!editId){
    wireEnterToAIParse(overlay.querySelector('#tName'), (d)=>{
      overlay.querySelector('#tName').value = d.title || overlay.querySelector('#tName').value;
      if(d.stakeholder) tWho.setValue([d.stakeholder]);
      if(!draft.steps.length && d.title){
        draft.steps.push({content:d.title, time:d.noTime?null:(d.time||'09:00'), noTime:!!d.noTime, reminder:true, repeat:null});
        renderStepRows();
      }
    });
  }

  function renderStepRows(){
    const listEl = overlay.querySelector('#stepList'); listEl.innerHTML='';
    draft.steps.forEach((st,i)=>{
      const row = el(`<div class="cardsplit" style="padding:10px;margin-bottom:8px;"></div>`);
      row.innerHTML = `
        <div class="field"><label>步骤内容</label><input type="text" value="${(st.content||'').replace(/"/g,'&quot;')}" data-f="content" data-i="${i}" placeholder="例如：确认会议室设备与投屏..."></div>
        <div class="inline">
          <div class="field"><label>时间</label><input type="time" value="${st.time||''}" data-f="time" data-i="${i}" ${st.noTime?'disabled':''}></div>
          <div class="field"><label>循环规则（必选，参考 Outlook 的"定期"设置）</label><div id="stepRecWrap_${i}"></div></div>
        </div>
        <div class="checkline"><label><input type="checkbox" data-f="noTime" data-i="${i}" ${st.noTime?'checked':''}> 无固定时间</label>
        <label style="margin-left:10px;"><input type="checkbox" data-f="reminder" data-i="${i}" ${st.reminder!==false?'checked':''}> 需要提醒</label>
        <button class="btn ghost sm" style="margin-left:auto;" data-delstep="${i}">删除步骤</button></div>
      `;
      listEl.appendChild(row);
      const recPicker = renderRecurrencePicker(st.repeat||null, (rec)=>{ draft.steps[i].repeat = rec; }, true);
      row.querySelector(`#stepRecWrap_${i}`).appendChild(recPicker);
    });
    listEl.querySelectorAll('[data-f]').forEach(inp=>{
      inp.onchange = ()=>{
        const i = +inp.dataset.i, f = inp.dataset.f;
        let val = inp.type==='checkbox'? inp.checked : inp.value;
        draft.steps[i][f]=val;
        if(f==='noTime') renderStepRows();
      };
    });
    listEl.querySelectorAll('[data-delstep]').forEach(b=>{ b.onclick=()=>{ draft.steps.splice(+b.dataset.delstep,1); renderStepRows(); }; });
  }
  overlay.querySelector('#addStepBtn').onclick = ()=>{ draft.steps.push({content:'', time:'09:00', noTime:false, reminder:true, repeat:null}); renderStepRows(); };
  renderStepRows();
  overlay.querySelector('#tCancel').onclick = ()=>overlay.remove();
  overlay.querySelector('#tSave').onclick = ()=>{
    const name = overlay.querySelector('#tName').value.trim();
    if(!name || !draft.steps.length){ alert('请填写事项名称并至少添加一个步骤'); return; }
    const missing = draft.steps.findIndex(s=>!s.repeat);
    if(missing!==-1){ alert(`第 ${missing+1} 个步骤还没设置循环规则，每个步骤都需要设置。`); return; }
    for(const s of draft.steps){
      if(s.repeat.freq==='weekly' && !s.repeat.weekdays.length){ alert(`步骤「${s.content||'(未命名)'}」按周循环但没有勾选任何星期，请检查。`); return; }
    }
    const stakeholder = tWho.getValue();
    if(editId){
      const t = S.templates.find(x=>x.id===editId);
      t.name=name; t.stakeholder=stakeholder;
      t.steps = draft.steps.map(s=>({id:s.id||uid(), content:s.content, time:s.time, noTime:s.noTime, reminder:s.reminder, repeat:s.repeat}));
    } else {
      S.templates.push({ id:uid(), name, stakeholder,
        steps: draft.steps.map(s=>({id:uid(), content:s.content, time:s.time, noTime:s.noTime, reminder:s.reminder, repeat:s.repeat})), takeaways:[], createdAt:Date.now() });
    }
    persist('templates'); overlay.remove(); ui.tab='projects'; render();
  };
}

          inp.onblur = commit;
          inp.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); inp.blur(); } if(e.key==='Escape'){ inp.value=v; inp.blur(); } };
        };
        c.appendChild(chip);
      });
    }
    renderChips('stkChips', S.dropdowns.stakeholders);
    renderChips('nameChips', S.dropdowns.eventNames);
    document.getElementById('stkAdd').onclick = ()=>{ const v=document.getElementById('stkNew').value.trim(); if(v){ S.dropdowns.stakeholders.push(v); persist('dropdowns'); render(); } };
    document.getElementById('nameAdd').onclick = ()=>{ const v=document.getElementById('nameNew').value.trim(); if(v){ S.dropdowns.eventNames.push(v); persist('dropdowns'); render(); } };
    document.getElementById('exportBtn').onclick = ()=>{
      const exportable = {
        templates:S.templates, projects:S.projects, instances:S.instances, cycles:S.cycles,
        dropdowns:S.dropdowns, takeawaysByName:S.takeawaysByName, freeTakeaways:S.freeTakeaways, todayOrder:S.todayOrder, raw:S.raw
      };
      const blob = new Blob([JSON.stringify(exportable,null,2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download=`工作台账备份_${todayStr()}.json`; a.click();
      URL.revokeObjectURL(url);
    };
    document.getElementById('importFile').onchange = (e)=>{
      const f = e.target.files[0]; if(!f) return;
      const reader = new FileReader();
      reader.onload = async ()=>{
        try{
          const data = JSON.parse(reader.result);
          delete data.config; // safety net: never let an imported file overwrite local credentials/login
          S = Object.assign(S, data);
          await persist(); render(); showToast('导入成功');
        }catch(err){ alert('文件格式不正确'); }
      };
      reader.readAsText(f);
    };
  },0);
  return wrap;
}

/* ============ voice input (Web Speech API) ============ */
let recognizer=null, listening=false;
function attachVoice(btn, textarea){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ btn.title='当前浏览器不支持语音输入（建议 Chrome），可用输入法自带的语音转文字'; btn.style.opacity=.4; return; }
  btn.onclick = ()=>{
    if(listening){ if(recognizer) recognizer.stop(); listening=false; btn.classList.remove('listening'); return; }
    recognizer = new SR();
    recognizer.lang='zh-CN'; recognizer.continuous=true; recognizer.interimResults=true;
    const base = textarea.value;
    let finalText = base ? base+' ' : '';
    recognizer.onresult = (e)=>{
      let interim='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        const t = e.results[i][0].transcript;
        if(e.results[i].isFinal) finalText += t;
        else interim += t;
      }
      textarea.value = finalText + interim;
    };
    recognizer.onerror = (e)=>{ listening=false; btn.classList.remove('listening'); if(e.error!=='no-speech') showToast('语音识别出错：'+e.error); };
    recognizer.onend = ()=>{ if(listening){ try{ recognizer.start(); }catch(e){} } else btn.classList.remove('listening'); };
    try{ recognizer.start(); listening=true; btn.classList.add('listening'); }
    catch(e){ showToast('无法启动语音输入'); }
  };
}

function blankDraft(text){
  return {title:text.slice(0,30), stakeholder:'', category:'adhoc', dueDate:null, time:null, noTime:true, multiStepGuess:false};
}
// Wires "回车 = AI 解析" onto a plain name/title input elsewhere in the app (project-library
// creation forms), reusing the same aiParse() used by the quick-add bar. onFilled(draft) is
// called with the first parsed item so the caller can push values into its own form fields.
function wireEnterToAIParse(inputEl, onFilled){
  inputEl.onkeydown = async (e)=>{
    if(e.key!=='Enter') return;
    e.preventDefault();
    const text = inputEl.value.trim();
    if(!text) return;
    showToast('AI 解析中…');
    try{
      const drafts = await aiParse(text);
      const d = (drafts && drafts.length) ? drafts[0] : blankDraft(text);
      onFilled(d);
      showToast('已用 AI 识别结果自动填充，请检查一下');
    }catch(err){
      showToast('AI 解析失败（'+err.message+'），请手动填写');
    }
  };
}

function buildParsePrompt(text){
  const projectList = S.projects.filter(p=>p.status!=='已结束').map(p=>`project:${p.id} = ${p.name}`);
  const templateList = S.templates.map(t=>`recurring:${t.id} = ${t.name}`);
  const knownList = [...projectList, ...templateList];
  const knownBlock = knownList.length
    ? `当前系统里已存在的项目/周期事项清单（key = 名称）：\n${knownList.join('\n')}\n如果本条事项明显属于清单里的某一项（比如提到了同名项目、同一个周期性事项的又一次任务），把该项的 key 原样填入 linkTo 字段；如果不确定或找不到匹配，linkTo 填空字符串，不要瞎猜。`
    : `当前系统里还没有已存在的项目/周期事项，linkTo 一律填空字符串。`;
  return `你是一个投资机构行政助理的工作事项解析助手。用户会输入一段口语化描述，你需要把它拆解成结构化字段，严格只输出 JSON，不要任何前后缀文字或代码块标记。
如果一段话里包含多个彼此独立的事项，返回一个数组，每个元素是一个事项。
每个事项字段：
- title: 事项名称/简述（字符串，尽量简短）
- stakeholder: 需求方/服务对象（字符串，识别不到则为空字符串）
- category: 三选一 "recurring"(固定周期型，如周会/月报/考勤等有固定周期节奏的) / "adhoc"(按需日常型，简单的一次性委托或支持性事务) / "project"(项目制，长期、分阶段、需要规划的事务)
- dueDate: 如果原文提到了具体日期，给出 YYYY-MM-DD（今天是 ${todayStr()}，如果是"下周三"这类相对时间，请据此推算），否则为 null
- time: 如果提到具体时刻，给出 HH:MM，否则 null
- noTime: 布尔值，如果没有明确时间点则为 true
- multiStepGuess: 布尔值，如果原文有"先...再...然后..."这类多步骤结构则为 true
- linkTo: 字符串，见下方说明
${knownBlock}
输出格式：{"items": [ {...}, {...} ]}
用户输入：${text}`;
}
function normalizeItems(items){
  const validLinkIds = new Set([
    ...S.projects.map(p=>`project:${p.id}`),
    ...S.templates.map(t=>`recurring:${t.id}`)
  ]);
  return items.map(it=>({
    title: it.title||'', stakeholder: it.stakeholder||'', category: ['recurring','adhoc','project'].includes(it.category)?it.category:'adhoc',
    dueDate: it.dueDate||null, time: it.time||null, noTime: it.noTime!==false && !it.time,
    multiStepGuess: !!it.multiStepGuess,
    linkTo: (it.linkTo && validLinkIds.has(it.linkTo)) ? it.linkTo : ''
  }));
}
async function aiParse(text){
  if(S.config.aiProvider==='deepseek' && S.config.deepseekKey){
    return await aiParseDeepSeek(text);
  }
  if(S.config.aiProvider==='deepseek' && !S.config.deepseekKey){
    showToast('未配置 DeepSeek Key，已改用内置 AI 解析，可在设置里补上 Key');
  }
  return await aiParseClaude(text);
}
async function aiParseDeepSeek(text){
  const resp = await fetch("https://api.deepseek.com/chat/completions", {
    method:"POST",
    headers:{ "Content-Type":"application/json", "Authorization": `Bearer ${S.config.deepseekKey}` },
    body: JSON.stringify({
      model:"deepseek-chat",
      messages:[{role:"user", content: buildParsePrompt(text)}],
      response_format:{type:"json_object"}
    })
  });
  if(!resp.ok) throw new Error('DeepSeek 请求失败 '+resp.status);
  const data = await resp.json();
  let raw = data.choices?.[0]?.message?.content || '';
  raw = raw.replace(/```json|```/g,'').trim();
  const parsed = JSON.parse(raw);
  const items = parsed.items || (Array.isArray(parsed)? parsed: [parsed]);
  return normalizeItems(items);
}
async function aiParseClaude(text){
  let resp;
  try{
    resp = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:1000, messages:[{role:"user", content: buildParsePrompt(text)}] })
    });
  }catch(e){
    throw new Error('内置 AI 只在 Claude 预览环境里可用，这里似乎不是——请去设置里配置 DeepSeek Key，或改用手动创建');
  }
  if(!resp.ok) throw new Error('内置 AI 请求失败（很可能是因为不在 Claude 预览环境里）——请去设置里配置 DeepSeek Key，或改用手动创建');
  const data = await resp.json();
  let raw = (data.content||[]).map(c=>c.text||'').join('');
  raw = raw.replace(/```json|```/g,'').trim();
  const parsed = JSON.parse(raw);
  const items = parsed.items || (Array.isArray(parsed)? parsed: [parsed]);
  return normalizeItems(items);
}

function linkableOptions(){
  const opts = [];
  S.projects.forEach(p=> opts.push({value:`project:${p.id}`, label:`📁 ${p.name}（项目）`}));
  S.templates.forEach(t=> opts.push({value:`recurring:${t.id}`, label:`🔁 ${t.name}（周期）`}));
  return opts;
}
// Names that already exist in the project/recurring-template library — used as the
// ONLY suggestions in the 所属项目 datalist, so unfamiliar/one-off names don't clutter it.
function existingProjectNames(){
  const names = new Set();
  S.projects.forEach(p=>{ if(p.name) names.add(p.name); });
  S.templates.forEach(t=>{ if(t.name) names.add(t.name); });
  return [...names];
}
// Resolve free-typed project text to an existing project/template, exact match only
// (case/whitespace-insensitive). Empty string if nothing in the library matches.
function matchProjectByName(text){
  const norm = (text||'').trim().toLowerCase();
  if(!norm) return '';
  const p = S.projects.find(x=>(x.name||'').trim().toLowerCase()===norm);
  if(p) return `project:${p.id}`;
  const t = S.templates.find(x=>(x.name||'').trim().toLowerCase()===norm);
  if(t) return `recurring:${t.id}`;
  return '';
}
function openConfirmCards(drafts){
  ui.pendingCards = drafts.map(d=>{
    let projectText = '';
    if(d.linkTo){
      const [kind, id] = d.linkTo.split(':');
      if(kind==='project'){ const p=S.projects.find(x=>x.id===id); if(p) projectText=p.name; }
      else if(kind==='recurring'){ const t=S.templates.find(x=>x.id===id); if(t) projectText=t.name; }
    }
    if(!projectText && d.category==='project') projectText = d.title;
    return {...d, stakeholder: stkArr(d.stakeholder), addToDropdown:false, projectText, createProject:true};
  });
  renderConfirmModal();
}

              status:'todo', skipped:false, createdAt:Date.now() });
            if(expContent){ t.takeaways=t.takeaways||[]; t.takeaways.push(makeEntry(stepObj.id)); }

        if(expContent) newProj.takeaways.push(makeEntry(newProj.steps[0].id));
        S.projects.push(newProj);
      } else {
        S.instances.push({id:uid(), title:d.title, stakeholder:d.stakeholder, dueDate:d.dueDate||null, time:d.noTime?null:(d.time||null), noTime:!!d.noTime, status:'todo', createdAt:Date.now()});
        if(expContent){ S.takeawaysByName[d.title]=S.takeawaysByName[d.title]||[]; S.takeawaysByName[d.title].push(makeEntry(null)); }
      }
    });
    persist('dropdowns'); persist('projects'); persist('instances'); persist('cycles'); persist('templates'); persist('takeawaysByName');
    overlay.remove(); showToast('已入库'); render();
  };

(async function boot(){
  S.config = await loadConfig();
  if(cloudConfigured() && S.config.accessToken && Date.now() >= (S.config.tokenExpiry||0)){
    await tryRefreshToken();
  }
  await loadAll();
  render();
  setupGlobalShortcuts();
})();
</script>
